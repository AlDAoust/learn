<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title><meta name="theme-color" content="#2b1055">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#2b1055,#7597de 60%,#f6a6c1);min-height:100vh;color:#222}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}.date{color:#fff;font-weight:600;opacity:.9;margin:4px 2px 10px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
h1{font-size:1.45rem;margin:.1em 0 .4em}.why{color:#555;margin:0 0 14px}.meta{font-size:.8rem;color:#7b4bb7;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
ol{padding-left:1.2em;margin:0 0 14px}li{margin:8px 0;line-height:1.4}a.link{display:inline-block;margin-bottom:16px;color:#7b4bb7;font-weight:600;word-break:break-word}
.btn{width:100%;padding:15px;border:0;border-radius:14px;font-size:1.05rem;font-weight:700;background:#7b4bb7;color:#fff;cursor:pointer}.btn.done{background:#1b7f5a}
.stats{display:flex;gap:10px;margin-top:12px}.stat{flex:1;background:#ffffffcc;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;color:#2b1055}
.empty{text-align:center;font-size:1.2rem;padding:30px 10px}
</style></head><body><div class="wrap"><div class="date" id="date"></div><div class="card" id="card">Loading…</div>
<div class="stats"><div class="stat"><b id="streak">0</b>day streak</div><div class="stat"><b id="total">0</b>done total</div></div></div>
<script>
const TZ="America/Halifax",KEY="cheyTodayDone";
const ymd=d=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const today=ymd(new Date());let done=JSON.parse(localStorage.getItem(KEY)||"[]");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("date").textContent=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,weekday:"long",month:"long",day:"numeric"}).format(new Date());
function stats(){document.getElementById("total").textContent=done.length;let s=0,d=new Date(today+"T12:00:00Z");
if(!done.includes(today))d.setUTCDate(d.getUTCDate()-1);while(done.includes(d.toISOString().slice(0,10))){s++;d.setUTCDate(d.getUTCDate()-1)}
document.getElementById("streak").textContent=s}
fetch("tasks.json",{cache:"no-store"}).then(r=>r.json()).then(ts=>{const t=ts.find(x=>x.date===today),c=document.getElementById("card");
if(!t){c.innerHTML='<div class="empty">Nothing today. Enjoy it.</div>';return}
c.innerHTML=`<div class="meta">${esc(t.topic)} · about ${esc(t.minutes)} min</div><h1>${esc(t.title)}</h1><p class="why">${esc(t.why)}</p><ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${t.link?`<a class="link" href="${esc(t.link)}" target="_blank" rel="noopener">Open the link →</a>`:""}<button class="btn" id="done"></button>`;
const b=document.getElementById("done");const up=()=>{const d=done.includes(today);b.textContent=d?"✓ Done (tap to undo)":"Done";b.classList.toggle("done",d);stats()};
b.onclick=()=>{done=done.includes(today)?done.filter(x=>x!==today):[...done,today];localStorage.setItem(KEY,JSON.stringify(done));up()};up()})
.catch(()=>{document.getElementById("card").innerHTML='<div class="empty">Nothing today. Enjoy it.</div>'});stats();
</script></body></html>
