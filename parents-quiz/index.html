<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Magic Field Guide to Chey 🚌</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#ffe66d,#ff9f1c 40%,#2ec4b6);min-height:100vh;color:#222}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.18);margin-top:12px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.25rem;margin:.3em 0 .6em}
.bar{height:12px;background:#fff6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#6a4c93;width:0;transition:width .3s}
.ptxt{font-size:.85rem;color:#333;margin:6px 2px;font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:14px;background:#fafafa;font-size:1rem;cursor:pointer}
.opt.sel{border-color:#6a4c93;background:#efe6ff;font-weight:600}
.tot{display:flex;gap:10px}.tot .opt{text-align:center}
textarea{width:100%;min-height:110px;font-size:1rem;padding:12px;border-radius:12px;border:2px solid #ddd}
input[type=range]{width:100%;accent-color:#6a4c93;height:34px}
.ends{display:flex;justify-content:space-between;font-size:.85rem;color:#555}.val{text-align:center;font-size:1.6rem;font-weight:700;color:#6a4c93}
.nav{display:flex;gap:10px;margin-top:16px}.btn{flex:1;padding:14px;border:0;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;background:#6a4c93;color:#fff}
.btn.ghost{background:#eee;color:#333}.hint{color:#666;font-size:.9rem;margin:-4px 0 10px}
.frizz{font-style:italic;color:#6a4c93;margin-top:12px;font-size:.9rem}
pre{white-space:pre-wrap;background:#f6f3ff;padding:14px;border-radius:12px;font-size:.9rem;max-height:50vh;overflow:auto}
.sum dt{font-weight:700;margin-top:10px}.sum dd{margin:2px 0 0 0;color:#333}
#cpy{position:fixed;right:12px;bottom:12px;z-index:9;padding:10px 14px;border:0;border-radius:22px;background:#6a4c93;color:#fff;font-weight:700;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .3s;z-index:10;pointer-events:none}
#saved{font-size:.8rem;color:#1b7f5a;font-weight:600;opacity:0;transition:opacity .3s;margin-top:8px}.wrap{padding-bottom:70px}
</style></head><body><div class="wrap">
<div class="ptxt" id="ptxt"></div><div class="bar"><i id="bar"></i></div>
<div class="card" id="card"></div></div><button id="cpy">📋 Copy answers so far</button><div id="toast">Copied! Paste it to Ms. Frizzle</div>
<script>
const Q=[
{t:"text",q:"What lights Chey up? Describe a moment she was totally in her element.",h:"Paint the picture! What was she doing, saying, building?"},
{t:"multi",q:"Which of these give Chey energy? Pick all that fit.",o:["Being with animals 🐴","Making or earning money 💰","Hands-on, physical work","Deep 1-on-1 conversations","Being outdoors","Creating / designing","Solving a real-world problem","Helping or teaching others","Quiet solo time","Competing or a challenge"]},
{t:"multi",q:"And which tend to DRAIN her?",o:["Big piles of tasks at once","Unclear instructions","Long reading assignments","Sitting still for long","Being watched / evaluated","Busywork that feels pointless","Too many choices","Noisy, crowded spaces","Being rushed","Doing it all alone"]},
{t:"multi",q:"When Chey is overloaded, what does it look like from the outside?",o:["Goes quiet / withdraws","Gets irritable or snappy","Needs a nap or a reset","Procrastinates / avoids","Tears or big feelings","Scrolls or zones out","Says 'it's fine' (it isn't)"]},
{t:"text",q:"What helps her bounce back after a rough moment?",h:"A snack? A walk? A hug? Being left alone? Someone breaking it into one small next step?"},
{t:"rank",q:"How does Chey learn best? Rate each one.",o:["Watching (videos, demos)","Doing (hands-on, trying it)","Talking (discussing, explaining)","Reading (books, articles)"]},
{t:"slider",q:"How much structure does she thrive with?",l:["Total free range","Clear step-by-step plan"]},
{t:"slider",q:"How much adult presence helps her learn?",l:["Leave me be","Sit right beside me"]},
{t:"choice",q:"The perfect adult role for Chey is…",o:["A co-pilot doing it alongside her","A coach who checks in now and then","A guide who sets things up, then steps back","A sounding board she comes to when ready"]},
{t:"rank",q:"What really motivates her? Rate each.",o:["Freedom to choose (autonomy)","Getting good at things (competence)","Doing it with people she likes (connection)","Tangible rewards (money, perks)"]},
{t:"choice",q:"How long can she stay locked in on something that interests her?",o:["About 15 minutes","Around 30–45 minutes","An hour or two","Hours — she forgets to eat!","Depends wildly on the topic"]},
{t:"tot",q:"This or that: Chey prefers learning…",o:["Solo 🧍","With others 👯"]},
{t:"tot",q:"This or that: Chey would rather…",o:["Plan it first 📋","Jump in and figure it out 🏇"]},
{t:"choice",q:"When does her brain switch on?",o:["Early morning 🌅","Late morning","Afternoon","Evening 🌙","Late night owl 🦉"]},
{t:"text",q:"What are Chey's superpowers? And her lovable quirks?",h:"Strengths, talents, funny habits, the stuff that makes her HER."},
{t:"text",q:"Beyond horses, what is she curious about right now?",h:"Topics, YouTubers, side-hustle ideas, rabbit holes…"},
{t:"choice",q:"What's the best way to bring her something new?",o:["Casual chat, no pressure","Short and to the point","Written down so she can think","Show her an example first","Make it a challenge or game"]},
{t:"choice",q:"How does she usually take feedback?",o:["Loves it, wants more","Fine if it's specific and kind","Prefers to find mistakes herself","Takes it hard, needs gentle framing","Depends who it's from"]},
{t:"slider",q:"Big Five guess: Openness to new ideas",l:["Prefers the familiar","Endlessly curious"]},
{t:"slider",q:"Big Five guess: Conscientiousness",l:["Spontaneous","Organized & driven"]},
{t:"slider",q:"Big Five guess: Extraversion",l:["Recharges alone","Recharges with people"]},
{t:"choice",q:"Enneagram-ish: which sounds MOST like Chey?",o:["The Achiever (goals! results!)","The Individualist (deep, authentic, unique)","The Investigator (needs to understand it all)","The Challenger (strong-willed, in charge)","The Enthusiast (adventure, fun, options)","The Helper (caring, loyal)","The Peacemaker (calm, easygoing)"]},
{t:"choice",q:"If Chey were a horse breed, she'd be…",o:["Thoroughbred: fast, driven, competitive","Arabian: smart, spirited, sensitive","Quarter Horse: steady, versatile, hard-working","Mustang: free, independent, untamed","Friesian: striking, gentle, a bit dramatic","Clydesdale: strong, loyal, big heart"]},
{t:"text",q:"Last one! If this year of learning went perfectly, what would Chey say about it in a year?",h:"Dream a little. 🌈"}
];
const KEY="frizzleChayQuiz1";let S=JSON.parse(localStorage.getItem(KEY)||'{"i":-1,"a":{}}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
let svT;const saved=()=>{save();const e=document.getElementById("saved");if(e){e.style.opacity=1;clearTimeout(svT);svT=setTimeout(()=>e.style.opacity=0,1800)}};
async function copyTxt(t){try{await navigator.clipboard.writeText(t)}catch(_){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}}
function answered(i){const a=S.a[i];return !(a==null||a===""||(Array.isArray(a)&&!a.length&&!S.a[i+"o"]))}
function partial(){const n=Math.min(S.i+1,Q.length);return `Parents' Field Guide to Chey — answers (partial, through Q${n})\n\n`+Q.slice(0,n).map((q,i)=>answered(i)?`${i+1}. ${q.q}\n→ ${fmt(i)}`:null).filter(Boolean).join("\n\n")}
function toast(){const t=document.getElementById("toast");t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200)}
const card=document.getElementById("card"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const quips=["Seatbelts, everyone!","Take chances, make mistakes, get messy!","To the Magic School Bus!","Bus, do your stuff!","Now THAT's science!"];
function prog(){const n=Q.length,i=Math.max(0,Math.min(S.i,n));document.getElementById("bar").style.width=(i/n*100)+"%";
document.getElementById("ptxt").textContent=S.i<0?"Ready when you are":S.i>=n?"All done! 🎉":`Question ${S.i+1} of ${n}`;}
function render(){prog();save();window.scrollTo(0,0);document.getElementById("cpy").style.display=(S.i>=0&&S.i<Q.length)?"block":"none";
if(S.i<0){card.innerHTML=`<h1>🚌 The Magic Field Guide to Chey</h1><p>Hello, explorers! Today's field trip: the most fascinating learner we know. Answer together, ${Q.length} quick questions, one at a time. There are no wrong answers, only discoveries!</p><p class="hint">Your progress saves on this device automatically.</p><div class="nav"><button class="btn" id="go">${Object.keys(S.a).length?"Continue":"Let's go!"}</button></div>${Object.keys(S.a).length?'<div class="nav"><button class="btn ghost" id="reset">Start over</button></div>':''}`;
document.getElementById("go").onclick=()=>{S.i=Math.max(0,...Object.keys(S.a).map(Number).filter(k=>k<Q.length).map(k=>k));if(!Object.keys(S.a).length)S.i=0;render()};
const r=document.getElementById("reset");if(r)r.onclick=()=>{if(confirm("Erase all answers?")){S={i:0,a:{}};render()}};return}
if(S.i>=Q.length)return summary();
const q=Q[S.i],a=S.a[S.i];let h=`<h2>${esc(q.q)}</h2>`+(q.h?`<p class="hint">${esc(q.h)}</p>`:"");
if(q.t=="choice"||q.t=="tot")h+=`<div class="${q.t=="tot"?"tot":""}">`+q.o.map((o,k)=>`<button class="opt ${a==o?"sel":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")+"</div>";
if(q.t=="multi")h+=q.o.map(o=>`<button class="opt ${(a||[]).includes(o)?"sel":""}" data-m="${esc(o)}">${esc(o)}</button>`).join("")+`<textarea id="other" style="min-height:50px" placeholder="Other…">${esc((S.a[S.i+"o"])||"")}</textarea>`;
if(q.t=="slider"){const v=a??5;h+=`<div class="val" id="sv">${v}</div><input type="range" min="0" max="10" value="${v}" id="sl"><div class="ends"><span>${esc(q.l[0])}</span><span>${esc(q.l[1])}</span></div>`}
if(q.t=="rank")h+=q.o.map((o,k)=>{const v=(a||{})[o]??3;return `<p style="margin:14px 0 2px"><b>${esc(o)}</b>: <span id="r${k}">${"⭐".repeat(v)}</span></p><input type="range" min="1" max="5" value="${v}" data-r="${esc(o)}" data-k="${k}">`}).join("");
if(q.t=="text")h+=`<textarea id="tx" placeholder="Type away…">${esc(a||"")}</textarea>`;
h+=`<div class="nav"><button class="btn ghost" id="back">← Back</button><button class="btn" id="next">${S.i==Q.length-1?"Finish 🎉":"Next →"}</button></div><div id="saved">✓ Saved on this device</div><p class="frizz">${quips[S.i%quips.length]} — Ms. Frizzle</p>`;
card.innerHTML=h;
card.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.a[S.i]=b.dataset.v;card.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("sel",x==b));saved()});
card.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{let s=S.a[S.i]||[];s=s.includes(b.dataset.m)?s.filter(x=>x!=b.dataset.m):[...s,b.dataset.m];S.a[S.i]=s;b.classList.toggle("sel");saved()});
const ot=document.getElementById("other");if(ot)ot.oninput=()=>{S.a[S.i+"o"]=ot.value;saved()};
const sl=document.getElementById("sl");if(sl){if(a==null)S.a[S.i]=5;sl.oninput=()=>{S.a[S.i]=+sl.value;document.getElementById("sv").textContent=sl.value;saved()}}
card.querySelectorAll("[data-r]").forEach(r=>{S.a[S.i]=S.a[S.i]||{};if(S.a[S.i][r.dataset.r]==null)S.a[S.i][r.dataset.r]=3;r.oninput=()=>{S.a[S.i][r.dataset.r]=+r.value;document.getElementById("r"+r.dataset.k).textContent="⭐".repeat(r.value);saved()}});
const tx=document.getElementById("tx");if(tx)tx.oninput=()=>{S.a[S.i]=tx.value;saved()};
document.getElementById("back").onclick=()=>{S.i--;render()};document.getElementById("next").onclick=()=>{S.i++;render()};}
function fmt(i){const q=Q[i],a=S.a[i];if(a==null||a===""||(Array.isArray(a)&&!a.length&&!S.a[i+"o"]))return"(skipped)";
if(q.t=="slider")return`${a}/10 (0 = ${q.l[0]}, 10 = ${q.l[1]})`;if(q.t=="rank")return Object.entries(a).map(([k,v])=>`${k}: ${v}/5`).join("; ");
if(q.t=="multi")return[...(a||[]),S.a[i+"o"]?"Other: "+S.a[i+"o"]:""].filter(Boolean).join("; ");return String(a)}
function summary(){const txt="Parents' Field Guide to Chey — answers\n\n"+Q.map((q,i)=>`${i+1}. ${q.q}\n→ ${fmt(i)}`).join("\n\n");
card.innerHTML=`<h1>🎉 Field trip complete!</h1><p>Wonderful observations, scientists! Here's everything you discovered.</p><button class="btn" id="copy" style="width:100%;font-size:1.15rem;padding:18px">📋 Copy answers</button><p style="text-align:center;font-weight:700;color:#6a4c93">Paste this back to Ms. Frizzle.</p><dl class="sum">${Q.map((q,i)=>`<dt>${i+1}. ${esc(q.q)}</dt><dd>${esc(fmt(i))}</dd>`).join("")}</dl><pre id="raw" style="display:none">${esc(txt)}</pre><div class="nav"><button class="btn ghost" id="back">← Edit answers</button><button class="btn ghost" id="restart">Start over</button></div>`;
document.getElementById("copy").onclick=async e=>{try{await navigator.clipboard.writeText(txt)}catch(_){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}e.target.textContent="✅ Copied! Now paste it to Ms. Frizzle"};
document.getElementById("back").onclick=()=>{S.i=Q.length-1;render()};document.getElementById("restart").onclick=()=>{if(confirm("Erase all answers?")){S={i:-1,a:{}};render()}};}
document.getElementById("cpy").onclick=async()=>{await copyTxt(partial());toast()};
render();
</script></body></html>
